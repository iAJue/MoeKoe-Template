<html><head><base href="/cart">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物车 - 魔法少女の秘密商店</title>
<style>
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Kawaii', sans-serif;
    background-color: #fce4ec;
    color: #ff4081;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

header {
    background-color: #f8bbd0;
    padding: 20px 0;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h1 {
    font-size: 2.5em;
    margin: 0;
    color: #c2185b;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
}

nav {
    margin-top: 20px;
}

nav a {
    color: #880e4f;
    text-decoration: none;
    margin: 0 15px;
    font-size: 1.2em;
    transition: color 0.3s ease;
}

nav a:hover {
    color: #ff4081;
}

.cart-items {
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    padding: 20px;
    margin-top: 40px;
}

.cart-item {
    display: flex;
    align-items: center;
    border-bottom: 1px solid #fce4ec;
    padding: 15px 0;
}

.cart-item:last-child {
    border-bottom: none;
}

.item-image {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 5px;
    margin-right: 20px;
}

.item-details {
    flex-grow: 1;
}

.item-name {
    font-size: 1.2em;
    color: #c2185b;
    margin: 0 0 5px 0;
}

.item-price {
    font-size: 1.1em;
    color: #ff4081;
    font-weight: bold;
}

.item-quantity {
    display: flex;
    align-items: center;
    margin-top: 10px;
}

.quantity-btn {
    background-color: #f8bbd0;
    border: none;
    color: #880e4f;
    font-size: 1.2em;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.quantity-btn:hover {
    background-color: #f48fb1;
}

.quantity-input {
    width: 40px;
    text-align: center;
    font-size: 1em;
    margin: 0 10px;
    border: 1px solid #f8bbd0;
    border-radius: 5px;
}

.remove-btn {
    background-color: #ff4081;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.remove-btn:hover {
    background-color: #f50057;
}

.cart-summary {
    margin-top: 20px;
    text-align: right;
}

.total {
    font-size: 1.5em;
    color: #c2185b;
    margin-bottom: 20px;
}

.checkout-btn {
    background-color: #ff4081;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 1.2em;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.checkout-btn:hover {
    background-color: #f50057;
}

footer {
    margin-top: 40px;
    text-align: center;
    padding: 20px;
    background-color: #f8bbd0;
    color: #880e4f;
}

@keyframes float {
    0% {
        transform: translateY(0px);
    }
    50% {
        transform: translateY(-10px);
    }
    100% {
        transform: translateY(0px);
    }
}

.floating {
    animation: float 3s ease-in-out infinite;
}
</style>
</head>
<body>
    <header>
        <h1>魔法少女の秘密商店</h1>
        <nav>
            <a href="/">首页</a>
            <a href="/products">所有商品</a>
            <a href="/categories">分类</a>
            <a href="/cart">购物车</a>
            <a href="/account">我的账户</a>
        </nav>
    </header>

    <div class="container">
        <h1>我的购物车</h1>
        <div class="cart-items">
            <div class="cart-item">
                <img src="https://isekai-shopper.com/images/magical-wand.jpg" alt="粉色星星魔法棒，闪耀着柔和的光芒" class="item-image floating" width="100" height="100">
                <div class="item-details">
                    <h2 class="item-name">星光闪耀魔法棒</h2>
                    <p class="item-price">￥9999</p>
                    <div class="item-quantity">
                        <button class="quantity-btn minus">-</button>
                        <input type="number" class="quantity-input" value="1" min="1">
                        <button class="quantity-btn plus">+</button>
                    </div>
                </div>
                <button class="remove-btn">删除</button>
            </div>
            <div class="cart-item">
                <img src="https://isekai-shopper.com/images/transformation-brooch.jpg" alt="心形变身胸针，镶嵌着彩虹宝石" class="item-image floating" width="100" height="100">
                <div class="item-details">
                    <h2 class="item-name">彩虹心愿变身胸针</h2>
                    <p class="item-price">￥8888</p>
                    <div class="item-quantity">
                        <button class="quantity-btn minus">-</button>
                        <input type="number" class="quantity-input" value="1" min="1">
                        <button class="quantity-btn plus">+</button>
                    </div>
                </div>
                <button class="remove-btn">删除</button>
            </div>
        </div>
        <div class="cart-summary">
            <p class="total">总计: ￥18887</p>
            <button class="checkout-btn">前往结算</button>
        </div>
    </div>

    <footer>
        <p>© 2023 魔法少女の秘密商店 | 用爱与魔法点亮每一天</p>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const quantityInputs = document.querySelectorAll('.quantity-input');
        const minusButtons = document.querySelectorAll('.minus');
        const plusButtons = document.querySelectorAll('.plus');
        const removeButtons = document.querySelectorAll('.remove-btn');
        const checkoutBtn = document.querySelector('.checkout-btn');

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('.cart-item').forEach(item => {
                const price = parseFloat(item.querySelector('.item-price').textContent.replace('￥', ''));
                const quantity = parseInt(item.querySelector('.quantity-input').value);
                total += price * quantity;
            });
            document.querySelector('.total').textContent = `总计: ￥${total.toFixed(2)}`;
        }

        quantityInputs.forEach(input => {
            input.addEventListener('change', updateTotal);
        });

        minusButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentNode.querySelector('.quantity-input');
                if (input.value > 1) {
                    input.value = parseInt(input.value) - 1;
                    updateTotal();
                }
            });
        });

        plusButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentNode.querySelector('.quantity-input');
                input.value = parseInt(input.value) + 1;
                updateTotal();
            });
        });

        removeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                this.closest('.cart-item').remove();
                updateTotal();
            });
        });

        checkoutBtn.addEventListener('click', function() {
            alert('准备结算！魔法少女正在处理您的订单...');
        });
    });
    </script>
</body>
</html>
