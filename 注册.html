<html><head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 & 找回密码 - 魔法少女の秘密商店</title>
<style>
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Kawaii', sans-serif;
    background-color: #fce4ec;
    color: #ff4081;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background-color: white;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 300px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

h1 {
    color: #c2185b;
    margin-bottom: 30px;
    font-size: 28px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

form {
    display: flex;
    flex-direction: column;
}

input {
    margin: 10px 0;
    padding: 12px;
    border: 2px solid #f8bbd0;
    border-radius: 10px;
    font-size: 16px;
    transition: border-color 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #ff4081;
}

button {
    background-color: #ff4081;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.1s ease;
    margin-top: 20px;
}

button:hover {
    background-color: #c2185b;
}

button:active {
    transform: scale(0.98);
}

.link {
    margin-top: 20px;
    font-size: 14px;
}

.link a {
    color: #ff4081;
    text-decoration: none;
    font-weight: bold;
}

.link a:hover {
    text-decoration: underline;
}

.tabs {
    display: flex;
    justify-content: space-around;
    margin-bottom: 20px;
}

.tab {
    cursor: pointer;
    padding: 10px;
    border-bottom: 2px solid transparent;
    transition: border-color 0.3s ease;
}

.tab.active {
    border-bottom-color: #ff4081;
}

.form-container {
    display: none;
}

.form-container.active {
    display: block;
}

@keyframes float {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
    100% { transform: translateY(0px) rotate(0deg); }
}

.magic-icon {
    position: absolute;
    width: 30px;
    height: 30px;
    opacity: 0.6;
}

.magic-icon:nth-child(1) {
    top: 20px;
    left: 20px;
    animation: float 4s ease-in-out infinite;
}

.magic-icon:nth-child(2) {
    top: 20px;
    right: 20px;
    animation: float 3.5s ease-in-out infinite;
}

.magic-icon:nth-child(3) {
    bottom: 20px;
    left: 20px;
    animation: float 4.5s ease-in-out infinite;
}

.magic-icon:nth-child(4) {
    bottom: 20px;
    right: 20px;
    animation: float 3.8s ease-in-out infinite;
}

@keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1); }
}

.sparkle {
    position: absolute;
    width: 5px;
    height: 5px;
    background-color: #ffeb3b;
    border-radius: 50%;
    animation: sparkle 2s infinite;
}
</style>
</head>
<body>
    <div class="container">
        <svg class="magic-icon" viewBox="0 0 24 24" fill="#ff4081">
            <path d="M7,3L3,7V5H1V9H5V7H3L7,3M9,5V1H11V5H9M13,5V1H15V5H13M17,5V1H19V5H17M21,5H19V3L21,1V5M3,11H1V13H3V11M21,11V13H23V11H21M3,15H1V17H3V15M21,15V17H23V15H21M3,19H1V21H3V19M21,19V21H23V19H21Z"/>
        </svg>
        <svg class="magic-icon" viewBox="0 0 24 24" fill="#ff4081">
            <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z"/>
        </svg>
        
        <h1>魔法少女の秘密商店</h1>
        
        <div class="tabs">
            <div class="tab active" data-form="register">注册</div>
            <div class="tab" data-form="recover">找回密码</div>
        </div>
        
        <div class="form-container active" id="register-form">
            <form id="register">
                <input type="text" id="reg-username" placeholder="选择你的魔法使用者名称" required>
                <input type="email" id="reg-email" placeholder="你的魔法通讯邮箱" required>
                <input type="password" id="reg-password" placeholder="创建你的神秘咒语（密码）" required>
                <input type="password" id="reg-confirm-password" placeholder="再次确认你的神秘咒语" required>
                <button type="submit">开启魔法之旅</button>
            </form>
            <p class="link">已经是魔法少女了？<a href="/login">立即登录</a></p>
        </div>
        
        <div class="form-container" id="recover-form">
            <form id="recover">
                <input type="email" id="recover-email" placeholder="输入你的魔法通讯邮箱" required>
                <button type="submit">找回神秘咒语</button>
            </form>
            <p class="link">突然想起来了？<a href="/login">返回登录</a></p>
        </div>
    </div>

    <script>
    function createSparkles() {
        const container = document.querySelector('.container');
        for (let i = 0; i < 20; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = `${Math.random() * 100}%`;
            sparkle.style.top = `${Math.random() * 100}%`;
            sparkle.style.animationDelay = `${Math.random() * 2}s`;
            container.appendChild(sparkle);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        createSparkles();

        const tabs = document.querySelectorAll('.tab');
        const forms = document.querySelectorAll('.form-container');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const formId = tab.getAttribute('data-form');
                
                tabs.forEach(t => t.classList.remove('active'));
                forms.forEach(f => f.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(`${formId}-form`).classList.add('active');
            });
        });

        const registerForm = document.getElementById('register');
        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            
            if (password !== confirmPassword) {
                alert('两次输入的神秘咒语不一致，请重新确认！');
                return;
            }
            
            // 这里应该是发送到服务器进行注册的代码
            // 为了演示，我们只做一个简单的提示
            alert(`欢迎加入魔法世界，${username}！你的魔法使用者名称已经被记录在案。请牢记你的神秘咒语哦！`);
        });

        const recoverForm = document.getElementById('recover');
        recoverForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('recover-email').value;
            
            // 这里应该是发送到服务器进行密码重置的代码
            // 为了演示，我们只做一个简单的提示
            alert(`神秘咒语重置魔法已经发送到 ${email}。请查看你的魔法通讯邮箱以重置咒语！`);
        });
    });
    </script>
</body>
</html>
