<html><head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单列表 - 魔法少女の秘密商店</title>
<style>
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Kawaii', sans-serif;
    background-color: #fce4ec;
    color: #ff4081;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

header {
    background-color: #f8bbd0;
    padding: 20px 0;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h1, h2, h3 {
    color: #c2185b;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
}

nav {
    margin-top: 20px;
}

nav a {
    color: #880e4f;
    text-decoration: none;
    margin: 0 15px;
    font-size: 1.2em;
    transition: color 0.3s ease;
}

nav a:hover {
    color: #ff4081;
}

.order-list {
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    padding: 20px;
    margin-top: 40px;
}

.order-item {
    border-bottom: 2px solid #fce4ec;
    padding: 20px 0;
}

.order-item:last-child {
    border-bottom: none;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.order-info {
    flex: 1;
}

.order-number {
    font-size: 1.2em;
    color: #c2185b;
    margin-bottom: 10px;
}

.order-date, .order-status, .order-total {
    font-size: 0.9em;
    color: #ff4081;
    margin-bottom: 5px;
}

.order-status {
    font-weight: bold;
}

.order-actions {
    display: flex;
    gap: 10px;
}

.action-button {
    background-color: #ff4081;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.action-button:hover {
    background-color: #c2185b;
}

.status-pending {
    color: #ffa000;
}

.status-shipped {
    color: #4caf50;
}

.status-delivered {
    color: #2196f3;
}

.status-cancelled {
    color: #f44336;
}

.order-details {
    margin-top: 20px;
}

.product-list {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.product-item {
    display: flex;
    align-items: center;
    width: calc(50% - 10px);
    background-color: #fff0f5;
    border-radius: 5px;
    padding: 10px;
}

.product-image {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 5px;
    margin-right: 15px;
}

.product-info {
    flex: 1;
}

.product-name {
    font-weight: bold;
    color: #c2185b;
    margin-bottom: 5px;
}

.product-description {
    font-size: 0.9em;
    color: #ff4081;
    margin-bottom: 5px;
}

.product-price-quantity {
    font-size: 0.9em;
    color: #880e4f;
}

.shipping-info, .logistics-info {
    margin-top: 20px;
    background-color: #fff0f5;
    border-radius: 5px;
    padding: 15px;
}

.shipping-info h3, .logistics-info h3 {
    margin-top: 0;
    color: #c2185b;
}

.logistics-timeline {
    margin-top: 10px;
    padding-left: 20px;
    border-left: 2px solid #ff4081;
}

.logistics-event {
    margin-bottom: 10px;
    position: relative;
}

.logistics-event:before {
    content: '';
    width: 10px;
    height: 10px;
    background-color: #ff4081;
    border-radius: 50%;
    position: absolute;
    left: -26px;
    top: 5px;
}

footer {
    margin-top: 40px;
    text-align: center;
    padding: 20px;
    background-color: #f8bbd0;
    color: #880e4f;
}

.pagination {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.pagination button {
    background-color: #f8bbd0;
    color: #880e4f;
    border: none;
    padding: 10px 15px;
    margin: 0 5px;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.pagination button:hover, .pagination button.active {
    background-color: #ff4081;
    color: white;
}

.empty-orders {
    text-align: center;
    padding: 40px;
    font-size: 1.2em;
    color: #880e4f;
}

.sparkle {
    position: absolute;
    width: 10px;
    height: 10px;
    background-color: #ffeb3b;
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
}

@keyframes sparkle {
    0% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0); }
}
</style>
</head>
<body>
    <header>
        <h1>魔法少女の秘密商店</h1>
        <nav>
            <a href="/">首页</a>
            <a href="/products">所有商品</a>
            <a href="/categories">分类</a>
            <a href="/cart">购物车</a>
            <a href="/account">我的账户</a>
        </nav>
    </header>

    <div class="container">
        <h1>我的订单</h1>
        <div class="order-list" id="order-list">
            <!-- 订单列表将通过 JavaScript 动态生成 -->
        </div>
        <div class="pagination" id="pagination">
            <!-- 分页按钮将通过 JavaScript 动态生成 -->
        </div>
    </div>

    <footer>
        <p>© 2023 魔法少女の秘密商店 | 用爱与魔法点亮每一天</p>
    </footer>

    <script>
    const orders = [
        {
            id: "ORD001",
            date: "2023-05-01",
            status: "已发货",
            total: 9999,
            items: [
                {
                    name: "星光魔法杖",
                    description: "闪耀星光，释放魔法力量",
                    quantity: 1,
                    price: 9999,
                    image: "https://example.com/magic-wand.jpg"
                }
            ],
            shippingInfo: {
                name: "小樱",
                address: "魔法王国 星光大道 1号",
                phone: "12345678910"
            },
            logistics: [
                { time: "2023-05-02 10:00", event: "订单已发货" },
                { time: "2023-05-03 14:30", event: "包裹已到达魔法转运中心" },
                { time: "2023-05-04 09:15", event: "包裹正在配送中" }
            ]
        },
        {
            id: "ORD002",
            date: "2023-05-05",
            status: "待发货",
            total: 8332,
            items: [
                {
                    name: "彩虹变身裙",
                    description: "穿上它，变身为最闪亮的魔法少女",
                    quantity: 1,
                    price: 7777,
                    image: "https://example.com/transformation-dress.jpg"
                },
                {
                    name: "魔力蛋糕",
                    description: "吃下它，获得源源不断的魔法能量",
                    quantity: 1,
                    price: 555,
                    image: "https://example.com/magic-cake.jpg"
                }
            ],
            shippingInfo: {
                name: "小梅",
                address: "魔法王国 彩虹街 2号",
                phone: "10987654321"
            },
            logistics: []
        },
        {
            id: "ORD003",
            date: "2023-05-10",
            status: "已送达",
            total: 8888,
            items: [
                {
                    name: "古老魔法书",
                    description: "记载着失传已久的神秘魔法",
                    quantity: 1,
                    price: 8888,
                    image: "https://example.com/magic-book.jpg"
                }
            ],
            shippingInfo: {
                name: "小狼",
                address: "魔法王国 知识大道 3号",
                phone: "13579246810"
            },
            logistics: [
                { time: "2023-05-11 09:00", event: "订单已发货" },
                { time: "2023-05-12 15:45", event: "包裹已到达魔法转运中心" },
                { time: "2023-05-13 10:30", event: "包裹正在配送中" },
                { time: "2023-05-13 16:20", event: "包裹已送达" }
            ]
        },
        {
            id: "ORD004",
            date: "2023-05-15",
            status: "已取消",
            total: 6666,
            items: [
                {
                    name: "月光宝石",
                    description: "蕴含月亮之力的神秘宝石",
                    quantity: 1,
                    price: 6666,
                    image: "https://example.com/moonstone.jpg"
                }
            ],
            shippingInfo: {
                name: "小可",
                address: "魔法王国 月光小径 4号",
                phone: "15935724680"
            },
            logistics: []
        }
    ];

    const ordersPerPage = 5;
    let currentPage = 1;

    function createOrderItem(order) {
        const orderItem = document.createElement('div');
        orderItem.className = 'order-item';
        orderItem.innerHTML = `
            <div class="order-header">
                <div class="order-info">
                    <div class="order-number">订单号: ${order.id}</div>
                    <div class="order-date">下单日期: ${order.date}</div>
                    <div class="order-status status-${order.status.toLowerCase().replace(/\s/g, '')}">状态: ${order.status}</div>
                    <div class="order-total">总金额: ❤️ ${order.total}</div>
                </div>
                <div class="order-actions">
                    <button class="action-button view-details">查看详情</button>
                    ${order.status === "待发货" ? '<button class="action-button cancel-order">取消订单</button>' : ''}
                </div>
            </div>
            <div class="order-details" style="display: none;">
                <h3>商品列表</h3>
                <div class="product-list">
                    ${order.items.map(item => `
                        <div class="product-item">
                            <img class="product-image" src="${item.image}" alt="${item.name}" width="80" height="80">
                            <div class="product-info">
                                <div class="product-name">${item.name}</div>
                                <div class="product-description">${item.description}</div>
                                <div class="product-price-quantity">价格: ❤️ ${item.price} | 数量: ${item.quantity}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="shipping-info">
                    <h3>收货信息</h3>
                    <p>收货人: ${order.shippingInfo.name}</p>
                    <p>地址: ${order.shippingInfo.address}</p>
                    <p>电话: ${order.shippingInfo.phone}</p>
                </div>
                ${order.logistics.length > 0 ? `
                    <div class="logistics-info">
                        <h3>物流信息</h3>
                        <div class="logistics-timeline">
                            ${order.logistics.map(log => `
                                <div class="logistics-event">
                                    <span class="logistics-time">${log.time}</span>
                                    <span class="logistics-description">${log.event}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
        return orderItem;
    }

    function displayOrders(page) {
        const orderList = document.getElementById('order-list');
        orderList.innerHTML = '';
        const startIndex = (page - 1) * ordersPerPage;
        const endIndex = startIndex + ordersPerPage;
        const ordersToDisplay = orders.slice(startIndex, endIndex);

        if (ordersToDisplay.length === 0) {
            orderList.innerHTML = '<div class="empty-orders">暂无订单</div>';
            return;
        }

        ordersToDisplay.forEach(order => {
            const orderItem = createOrderItem(order);
            orderList.appendChild(orderItem);
        });

        addSparkleEffect();
    }

    function createPagination() {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';
        const pageCount = Math.ceil(orders.length / ordersPerPage);

        for (let i = 1; i <= pageCount; i++) {
            const pageButton = document.createElement('button');
            pageButton.textContent = i;
            pageButton.classList.toggle('active', i === currentPage);
            pageButton.addEventListener('click', () => {
                currentPage = i;
                displayOrders(currentPage);
                createPagination();
            });
            paginationContainer.appendChild(pageButton);
        }
    }

    function addSparkleEffect() {
        const orderItems = document.querySelectorAll('.order-item');
        orderItems.forEach(item => {
            item.addEventListener('mouseover', createSparkle);
        });
    }

    function createSparkle(e) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = `${e.clientX}px`;
        sparkle.style.top = `${e.clientY}px`;
        document.body.appendChild(sparkle);

        sparkle.style.animation = 'sparkle 0.5s linear';
        sparkle.addEventListener('animationend', () => {
            sparkle.remove();
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        displayOrders(currentPage);
        createPagination();

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('view-details')) {
                const orderDetails = e.target.closest('.order-item').querySelector('.order-details');
                orderDetails.style.display = orderDetails.style.display === 'none' ? 'block' : 'none';
            } else if (e.target.classList.contains('cancel-order')) {
                const orderId = e.target.closest('.order-item').querySelector('.order-number').textContent.split(': ')[1];
                if (confirm(`确定要取消订单 ${orderId} 吗？`)) {
                    alert(`订单 ${orderId} 已取消`);
                    // 这里应该添加实际的取消订单逻辑
                }
            }
        });
    });
    </script>
</body>
</html>
