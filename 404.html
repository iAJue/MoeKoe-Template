<html><head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面未找到 - 魔法少女の秘密商店</title>
<style>
body, html {
    margin: 0;
    padding: 0;
    font-family: 'Kawaii', sans-serif;
    background-color: #fce4ec;
    color: #ff4081;
    height: 100%;
    overflow: hidden;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
    position: relative;
    z-index: 1;
}

header {
    background-color: #f8bbd0;
    padding: 20px 0;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h1, h2 {
    color: #c2185b;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
}

nav {
    margin-top: 20px;
}

nav a {
    color: #880e4f;
    text-decoration: none;
    margin: 0 15px;
    font-size: 1.2em;
    transition: color 0.3s ease;
}

nav a:hover {
    color: #ff4081;
}

.error-message {
    font-size: 2em;
    margin: 40px 0;
}

.magic-wand {
    width: 200px;
    height: 200px;
    margin: 40px auto;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23ff4081" d="M7.5 5.6L5 7l1.4-2.5L5 2l2.5 1.4L10 2 8.6 4.5 10 7 7.5 5.6m12 9.8L22 14l-1.4 2.5L22 19l-2.5-1.4L17 19l1.4-2.5L17 14l2.5 1.4M22 2l-1.4 2.5L22 7l-2.5-1.4L17 7l1.4-2.5L17 2l2.5 1.4L22 2m-8.66 10.78l2.44-2.44-2.44-2.44a1 1 0 0 1 0-1.41l.71-.71a1 1 0 0 1 1.41 0l2.44 2.44 2.44-2.44a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1 0 1.41l-2.44 2.44 2.44 2.44a1 1 0 0 1 0 1.41l-.71.71a1 1 0 0 1-1.41 0l-2.44-2.44-2.44 2.44a1 1 0 0 1-1.41 0l-.71-.71a1 1 0 0 1 0-1.41z"/></svg>') no-repeat center center;
    animation: rotate 10s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.magical-sparkles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.sparkle {
    position: absolute;
    background-color: #ffeb3b;
    border-radius: 50%;
    animation: twinkle 2s infinite;
}

@keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1); }
}

.back-button {
    background-color: #ff4081;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 1.2em;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.back-button:hover {
    background-color: #c2185b;
}

footer {
    position: absolute;
    bottom: 0;
    width: 100%;
    text-align: center;
    padding: 20px;
    background-color: #f8bbd0;
    color: #880e4f;
}
</style>
</head>
<body>
    <header>
        <h1>魔法少女の秘密商店</h1>
        <nav>
            <a href="/">首页</a>
            <a href="/products">所有商品</a>
            <a href="/categories">分类</a>
            <a href="/cart">购物车</a>
            <a href="/account">我的账户</a>
        </nav>
    </header>

    <div class="container">
        <h2>哎呀！魔法出错了！</h2>
        <p class="error-message">404 - 页面未找到</p>
        <div class="magic-wand"></div>
        <p>看来我们的魔法杖需要充能了。让我们回到首页，重新开始我们的魔法冒险吧！</p>
        <button class="back-button" onclick="window.location.href='/'">返回首页</button>
    </div>

    <div class="magical-sparkles" id="magical-sparkles"></div>

    <footer>
        <p>© 2023 魔法少女の秘密商店 | 用爱与魔法点亮每一天</p>
    </footer>

    <script>
    function createSparkle() {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.width = `${Math.random() * 10 + 5}px`;
        sparkle.style.height = sparkle.style.width;
        sparkle.style.left = `${Math.random() * 100}%`;
        sparkle.style.top = `${Math.random() * 100}%`;
        sparkle.style.animationDuration = `${Math.random() * 2 + 1}s`;
        return sparkle;
    }

    function addSparkles() {
        const magicalSparkles = document.getElementById('magical-sparkles');
        for (let i = 0; i < 50; i++) {
            magicalSparkles.appendChild(createSparkle());
        }
    }

    document.addEventListener('DOMContentLoaded', addSparkles);
    </script>
</body>
</html>
